<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#357ABD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5F8A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fond blanc -->
  <rect width="32" height="32" fill="white" rx="4"/>
  
  <!-- Logo OACA simplifié pour favicon -->
  <g transform="translate(4, 4)">
    <!-- Cercle principal -->
    <circle cx="8" cy="12" r="6" fill="none" stroke="url(#blueGradient)" stroke-width="1.5"/>
    
    <!-- Éléments intérieurs -->
    <path d="M 5 12 Q 8 9 11 12 Q 8 15 5 12" fill="none" stroke="url(#blueGradient)" stroke-width="1"/>
    <path d="M 8 9 Q 11 12 8 15 Q 5 12 8 9" fill="none" stroke="url(#blueGradient)" stroke-width="1"/>
    
    <!-- Lignes horizontales (pistes) -->
    <line x1="16" y1="10" x2="22" y2="10" stroke="url(#blueGradient)" stroke-width="1.5"/>
    <line x1="16" y1="12" x2="21" y2="12" stroke="url(#blueGradient)" stroke-width="1"/>
    <line x1="16" y1="14" x2="20" y2="14" stroke="url(#blueGradient)" stroke-width="1"/>
    
    <!-- Texte OACA -->
    <text x="12" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#2E5F8A" font-weight="bold">OACA</text>
  </g>
</svg>
